name: qq-rolebot
services:
  app:
    build: .
    image: qq-rolebot:local
    container_name: qq-rolebot
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      ADMIN_ADDITIONAL_ORIGINS: ${ADMIN_ADDITIONAL_ORIGINS:-}
      COOKIE_SECURE: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TZ: Asia/Shanghai
      CREATION_RENDER_SOCKET: /run/qq-rolebot-render/broker.sock
      CREATION_MEDIA_BASE: http://qq-rolebot:8080
    volumes:
      - ./data:/data
      - ${CREATION_RENDER_SOCKET_DIR:-/run/qq-rolebot-render}:/run/qq-rolebot-render:ro
    networks: [private, napcat]
    mem_limit: 512m
    cpus: 1.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  gateway:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: qq-rolebot-gateway
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_HTTP_PORT:-80}:80"
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks: [private]
    mem_limit: 128m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
networks:
  private:
    driver: bridge
  napcat:
    external: true
    name: ${NAPCAT_NETWORK:-napcat}
